name: Build and Push Docker Image for Surface Pro 11

on:
  push:
    branches:
      - main

# Surface Pro 11 (Snapdragon X) 向け。WSL で Adreno GPU を使うためのパッチを組み込む
env:
  WSL_GPU_REPO: https://github.com/0xAAA8000/WSL-Qualcomm-GPU.git
  TAG: surface11

jobs:
  build-common:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.local
          target: common-build
          build-contexts: wsl-gpu=${{ env.WSL_GPU_REPO }}
          push: false # 公開はしない
          platforms: linux/arm64
          # docker-build.yml とキャッシュが混ざらないようscopeを分ける
          cache-from: type=gha,scope=surface11-common-arm64
          cache-to: type=gha,mode=max,scope=surface11-common-arm64


  build-each-target:
    needs: build-common
    strategy:
      fail-fast: false
      matrix:
        target: [l1, l2, sim]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write  # GHCRへの書き込み権限を付与

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GHCRのイメージ名は小文字必須
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.target }}" >> "$GITHUB_ENV"

      # GHCRへのログイン処理（GitHubから自動割り当てられるGITHUB_TOKENを使用）
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # docker-build.yml の :latest を上書きしないよう :surface11 タグで公開する
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.TAG }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.local
          target: ${{ matrix.target }}
          build-contexts: wsl-gpu=${{ env.WSL_GPU_REPO }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=surface11-common-arm64
