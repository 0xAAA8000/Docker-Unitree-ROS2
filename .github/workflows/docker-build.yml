name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-common:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.GITHUB_TOKEN }}
      
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: common-build
          push: false # 公開はしない
          cache-from: type=gha,scope=common
          cache-to: type=gha,mode=max,scope=common


  build-and-push:
    needs: build-common
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # GHCRへの書き込み権限を付与
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: l1
            target: l1
            image_name: ${{ github.repository }}/l1
          - name: l2
            target: l2
            image_name: ${{ github.repository }}/l2
          - name: sim
            target: sim
            image_name: ${{ github.repository }}/sim

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GHCRへのログイン処理（GitHubから自動割り当てられるGITHUB_TOKENを使用）
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ matrix.image_name }}
          tags: |
            type=raw,value=latest

      # ビルドとGHCRへのプッシュを同時に実行
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=common
