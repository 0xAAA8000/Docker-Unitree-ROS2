<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 960" width="980" height="960" role="img" aria-label="LiDAR の点群がドライバ、lidar_bridge、Point-LIO を通って 3D 点群になり、robot_map が 2D 地図 /map にして Web ノードと RViz に配る。obstacle_detector は lidar_bridge の点群から Nav2 の障害物を作る。スマホは HTTP で地図を受け取り、タップした目的地を Web ノード経由で Nav2 に送る。">
<style>
svg { --bg:#ffffff; --surface:#ffffff; --fg:#1d232b; --muted:#5b6573; --line:#9aa4b1;
  --c3d:#c4520f; --c2d:#1769c2; --cot:#6b7584; --chttp:#2a8a3e; --new:#7a3fc4; --new-bg:#f3edfb; }
@media (prefers-color-scheme: dark) {
  svg { --bg:#0d1117; --surface:#161b22; --fg:#e6e9ee; --muted:#9aa4b1; --line:#4c5562;
    --c3d:#ff8f4d; --c2d:#5aa9ff; --cot:#a3adba; --chttp:#5fd27a; --new:#b88cff; --new-bg:#2a2236; }
}
.bg { fill: var(--bg); }
.box { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.box.new { fill: var(--new-bg); stroke: var(--new); stroke-width: 2; }
.box.file { stroke-dasharray: 5 4; }
text { font-family: "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", "Yu Gothic", sans-serif; }
.name { font-size: 14px; font-weight: 600; fill: var(--fg); }
.sub { font-size: 11.5px; fill: var(--muted); }
.badge { font-size: 11px; font-weight: 600; fill: var(--new); }
.topic { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 500; fill: var(--fg); }
.kind { font-size: 11.5px; font-weight: 600; }
.e { fill: none; stroke-width: 2; }
.e.d3 { stroke: var(--c3d); } .k3 { fill: var(--c3d); }
.e.d2 { stroke: var(--c2d); } .k2 { fill: var(--c2d); }
.e.ot { stroke: var(--cot); } .ko { fill: var(--cot); }
.e.ht { stroke: var(--chttp); } .kh { fill: var(--chttp); }
.e.opt { stroke-dasharray: 6 5; }
</style>
<rect class="bg" x="0" y="0" width="980" height="960"/>
        <defs>
          <marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k3"/></marker>
          <marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k2"/></marker>
          <marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ko"/></marker>
          <marker id="mh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="kh"/></marker>
        </defs>

        <g>
<text x="24" y="34" class="name">凡例</text>
<line x1="24" y1="58" x2="64" y2="58" class="e d3"/>
<text x="74" y="62" class="sub">3D 点群</text>
<line x1="24" y1="80" x2="64" y2="80" class="e d2"/>
<text x="74" y="84" class="sub">2D 地図・経路</text>
<line x1="24" y1="102" x2="64" y2="102" class="e ot"/>
<text x="74" y="106" class="sub">IMU・オドメトリ・指令</text>
<line x1="24" y1="124" x2="64" y2="124" class="e ht"/>
<text x="74" y="128" class="sub">HTTP (Wi-Fi)</text>
<line x1="24" y1="146" x2="64" y2="146" class="e ot opt"/>
<text x="74" y="150" class="sub">任意・ファイル経由</text>
</g>
<!-- ===== 線 ===== -->
        <!-- LiDAR -> ドライバ -->
        <line x1="400" y1="76" x2="400" y2="148" class="e ot" marker-end="url(#mo)"/>
        <text x="412" y="112" class="sub">Ethernet / シリアル (生データ)</text>

        <!-- ドライバ -> lidar_bridge -->
        <line x1="370" y1="206" x2="370" y2="278" class="e d3" marker-end="url(#m3)"/>
        <text x="360" y="238" class="topic" text-anchor="end">/unilidar/cloud</text>
        <text x="360" y="254" class="kind k3" text-anchor="end">3D 点群</text>
        <line x1="430" y1="206" x2="430" y2="278" class="e ot" marker-end="url(#mo)"/>
        <text x="440" y="238" class="topic">/unilidar/imu</text>
        <text x="440" y="254" class="kind ko">IMU</text>

        <!-- lidar_bridge -> Point-LIO -->
        <line x1="370" y1="336" x2="370" y2="418" class="e d3" marker-end="url(#m3)"/>
        <text x="360" y="372" class="topic" text-anchor="end">/lidar</text>
        <text x="360" y="388" class="kind k3" text-anchor="end">3D 点群</text>
        <line x1="430" y1="336" x2="430" y2="418" class="e ot" marker-end="url(#mo)"/>
        <text x="440" y="372" class="topic">/imu</text>
        <text x="440" y="388" class="kind ko">IMU</text>

        <!-- lidar_bridge -> obstacle_detector -->
        <line x1="500" y1="308" x2="758" y2="308" class="e d3" marker-end="url(#m3)"/>
        <text x="629" y="298" class="topic" text-anchor="middle">/lidar_full</text>
        <text x="629" y="326" class="kind k3" text-anchor="middle">3D 点群</text>

        <!-- obstacle_detector -> Nav2 -->
        <line x1="900" y1="336" x2="900" y2="578" class="e d3" marker-end="url(#m3)"/>
        <text x="890" y="372" class="topic" text-anchor="end">/lidar_obstacles</text>
        <text x="890" y="388" class="topic" text-anchor="end">/lidar_clear</text>
        <text x="890" y="404" class="kind k3" text-anchor="end">障害物・クリア用の点群</text>

        <!-- Point-LIO -> Nav2 (オドメトリ) -->
        <polyline points="500,448 810,448 810,578" class="e ot" marker-end="url(#mo)"/>
        <text x="655" y="438" class="topic" text-anchor="middle">/aft_mapped_to_init · TF</text>
        <text x="655" y="466" class="kind ko" text-anchor="middle">オドメトリ・自己位置</text>

        <!-- Point-LIO -> scans.pcd -->
        <line x1="300" y1="448" x2="192" y2="448" class="e d3 opt" marker-end="url(#m3)"/>
        <text x="246" y="440" class="sub" text-anchor="middle">終了時に保存</text>

        <!-- Point-LIO -> robot_map -->
        <line x1="400" y1="476" x2="400" y2="578" class="e d3" marker-end="url(#m3)"/>
        <text x="412" y="518" class="topic">/cloud_registered</text>
        <text x="412" y="534" class="kind k3">3D 点群 (map 座標, 毎スキャン)</text>

        <!-- scans.pcd -> robot_map -->
        <polyline points="80,472 80,596 298,596" class="e d3 opt" marker-end="url(#m3)"/>
        <text x="92" y="560" class="sub">起動時に読み込み (任意)</text>
        <text x="92" y="576" class="kind k3">3D 点群</text>

        <!-- robot_map -> RViz -->
        <polyline points="300,622 140,622 140,738" class="e d2" marker-end="url(#m2)"/>
        <text x="152" y="676" class="topic">/map</text>
        <text x="152" y="692" class="kind k2">2D 地図</text>

        <!-- robot_map -> Nav2 (任意) -->
        <line x1="500" y1="592" x2="758" y2="592" class="e d2 opt" marker-end="url(#m2)"/>
        <text x="630" y="568" class="topic" text-anchor="middle">/map</text>
        <text x="630" y="584" class="kind k2" text-anchor="middle">2D 地図 (任意: static_layer)</text>

        <!-- robot_map -> Web -->
        <line x1="400" y1="636" x2="400" y2="738" class="e d2" marker-end="url(#m2)"/>
        <text x="390" y="682" class="topic" text-anchor="end">/map</text>
        <text x="390" y="698" class="kind k2" text-anchor="end">2D 地図 (OccupancyGrid)</text>

        <!-- Nav2 -> Web (/plan) -->
        <polyline points="760,614 690,614 690,756 502,756" class="e d2" marker-end="url(#m2)"/>
        <text x="680" y="682" class="topic" text-anchor="end">/plan</text>
        <text x="680" y="698" class="kind k2" text-anchor="end">2D 経路</text>

        <!-- Web -> Nav2 (目的地) -->
        <polyline points="500,782 720,782 720,636 758,636" class="e ot" marker-end="url(#mo)"/>
        <text x="610" y="802" class="topic" text-anchor="middle">navigate_to_pose</text>
        <text x="610" y="818" class="kind ko" text-anchor="middle">目的地 (アクション)</text>

        <!-- Nav2 -> cmd_vel_converter -->
        <line x1="860" y1="640" x2="860" y2="738" class="e ot" marker-end="url(#mo)"/>
        <text x="872" y="684" class="topic">/cmd_vel</text>
        <text x="872" y="700" class="kind ko">速度指令 (Twist)</text>

        <!-- cmd_vel_converter -> Arduino -->
        <line x1="860" y1="796" x2="860" y2="888" class="e ot" marker-end="url(#mo)"/>
        <text x="872" y="846" class="sub">USB シリアル</text>

        <!-- Web <-> スマホ -->
        <line x1="370" y1="796" x2="370" y2="888" class="e ht" marker-end="url(#mh)"/>
        <text x="360" y="838" class="sub" text-anchor="end">地図 PNG・現在地・経路</text>
        <text x="360" y="854" class="kind kh" text-anchor="end">HTTP 応答 (1 秒ごと)</text>
        <line x1="430" y1="890" x2="430" y2="798" class="e ht" marker-end="url(#mh)"/>
        <text x="440" y="858" class="sub">タップした目的地</text>
        <text x="440" y="874" class="kind kh">POST /api/goal</text>

        <!-- ===== ノード ===== -->
        <rect x="300" y="20" width="200" height="56" rx="6" class="box"/>
        <text x="400" y="44" class="name" text-anchor="middle">Unitree LiDAR</text>
        <text x="400" y="62" class="sub" text-anchor="middle">L1 / L2 (ハードウェア)</text>

        <rect x="300" y="150" width="200" height="56" rx="6" class="box"/>
        <text x="400" y="174" class="name" text-anchor="middle">unitree_lidar_ros2</text>
        <text x="400" y="192" class="sub" text-anchor="middle">ドライバ</text>

        <rect x="300" y="280" width="200" height="56" rx="6" class="box"/>
        <text x="400" y="304" class="name" text-anchor="middle">lidar_bridge</text>
        <text x="400" y="322" class="sub" text-anchor="middle">トピック名・座標の付け替え</text>

        <rect x="760" y="280" width="200" height="56" rx="6" class="box"/>
        <text x="860" y="304" class="name" text-anchor="middle">obstacle_detector</text>
        <text x="860" y="322" class="sub" text-anchor="middle">高さ・坂で障害物を判定</text>

        <rect x="300" y="420" width="200" height="56" rx="6" class="box"/>
        <text x="400" y="444" class="name" text-anchor="middle">Point-LIO</text>
        <text x="400" y="462" class="sub" text-anchor="middle">自己位置 + 3D 地図 (内部)</text>

        <rect x="20" y="424" width="172" height="48" rx="6" class="box file"/>
        <text x="106" y="444" class="name" text-anchor="middle">scans.pcd</text>
        <text x="106" y="462" class="sub" text-anchor="middle">保存された 3D 地図</text>

        <rect x="300" y="580" width="200" height="56" rx="6" class="box"/>
        <text x="400" y="604" class="name" text-anchor="middle">robot_map</text>
        <text x="400" y="622" class="sub" text-anchor="middle">3D 点群 → 2D 地図</text>

        <rect x="20" y="740" width="172" height="56" rx="6" class="box"/>
        <text x="106" y="764" class="name" text-anchor="middle">RViz2</text>
        <text x="106" y="782" class="sub" text-anchor="middle">/map を表示</text>

        <rect x="300" y="740" width="200" height="56" rx="6" class="box"/>
        <text x="400" y="764" class="name" text-anchor="middle">robot_goal web</text>
        <text x="400" y="782" class="sub" text-anchor="middle">HTTP · TF で現在地</text>

        <rect x="300" y="890" width="200" height="56" rx="6" class="box"/>
        <text x="400" y="914" class="name" text-anchor="middle">スマホのブラウザ</text>
        <text x="400" y="932" class="sub" text-anchor="middle">http://&lt;IP&gt;:8081 (モード選択から)</text>

        <rect x="760" y="580" width="200" height="60" rx="6" class="box"/>
        <text x="860" y="606" class="name" text-anchor="middle">Nav2</text>
        <text x="860" y="624" class="sub" text-anchor="middle">経路計画・追従</text>

        <rect x="760" y="740" width="200" height="56" rx="6" class="box"/>
        <text x="860" y="764" class="name" text-anchor="middle">cmd_vel_converter</text>
        <text x="860" y="782" class="sub" text-anchor="middle">Twist → 舵角・スロットル</text>

        <rect x="760" y="890" width="200" height="56" rx="6" class="box"/>
        <text x="860" y="914" class="name" text-anchor="middle">Arduino</text>
        <text x="860" y="932" class="sub" text-anchor="middle">サーボ・モータードライバ</text>
      </svg>
