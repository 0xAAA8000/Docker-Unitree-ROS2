# lidar_localization_ros2 parameters for Unitree L2.
# Based on the 2025 team's L1 settings (lidar_localization_ros2 param/localization.yaml
# as installed on the lab PC, upstream cd5e27a). Differences:
#   - map_path / initial pose are given by localization.launch.py
#   - initial_pose_qw 0.0 -> 1.0 (0 is not a valid rotation)
#   - use_imu false (L1 setup had it true but /imu was never connected, so it did nothing)
#   - tuned for this PC (i9-12900H): align takes ~1.5 ms per L2 scan vs an 83 ms budget,
#     so spend it on density: voxel_leaf_size 0.5 -> 0.2, threads 6 -> 12 (= P-core threads),
#     map downsampled to 0.05 m by l2loc. ndt_resolution stays 1.0 for a wider convergence basin.
/**:
    ros__parameters:
      registration_method: "NDT_OMP"
      score_threshold: 2.0
      ndt_resolution: 1.0
      ndt_step_size: 0.1
      ndt_num_threads: 12
      ndt_max_iterations: 35
      transform_epsilon: 0.001
      voxel_leaf_size: 0.2
      scan_max_range: 30.0
      scan_min_range: 1.0
      scan_period: 0.1
      use_pcd_map: true
      set_initial_pose: true
      use_odom: false
      use_imu: false
      enable_debug: false
      enable_map_odom_tf: false
      global_frame_id: map
      odom_frame_id: odom
      base_frame_id: base_link
      enable_timer_publishing: false
      pose_publish_frequency: 30.0
