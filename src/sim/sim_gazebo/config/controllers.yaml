controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ackermann_steering_controller:
      type: ackermann_steering_controller/AckermannSteeringController

ackermann_steering_controller:
  ros__parameters:
    use_sim_time: true

    front_steering: true # 前輪操舵
    open_loop: false
    position_feedback: false      # traction は velocity interface
    use_stamped_vel: false        # 2026/09/29: false->true # 10/04: true->false        # /…/reference_unstamped に Twist を流す
    reference_timeout: 0.5        # cmd_vel_timeout ではない

    # front_steering: true のとき front=ステアリング, rear=駆動
    front_wheels_names:           # ステアリング関節
      - front_left_steer_joint
      - front_right_steer_joint
    rear_wheels_names:            # 駆動関節
      - rear_left_wheel_joint
      - rear_right_wheel_joint

    wheelbase: 1.0
    front_wheel_track: 0.6
    rear_wheel_track: 0.6
    front_wheels_radius: 0.1      # wheels（複数形）
    rear_wheels_radius: 0.1       # wheels（複数形）

    odom_frame_id: odom
    base_frame_id: base_link
    enable_odom_tf: true
