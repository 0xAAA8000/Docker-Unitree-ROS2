# Gazebo のシミュレーション (sim_gazebo の four_wheel_car). 書き方は rc_car.yaml と同じ.
robot:
  sim: true
  lidar:
    model: sim
    # urdf/four_wheel_car.urdf の lidar_joint (前 0.2 m, 上 0.25 m, 傾きなし)
    mount: {x: 0.2, y: 0.0, z: 0.25, roll_deg: 0.0, pitch_deg: 0.0, yaw_deg: 0.0}
  body:
    footprint: [[0.2, 0.1], [0.2, -0.4], [-0.2, -0.4], [-0.2, 0.1]]
    ground_z: -0.10               # 地面は LiDAR の 0.35 m 下
    # 自車体の箱 (base_link 座標). filter_invalid_points には LiDAR 座標に直して渡る
    self_box_min: [-0.65, -0.40, -0.20]
    self_box_max: [0.65, 0.40, 0.35]
    wheelbase: 1.0
  cmd_vel_topic: /ackermann_steering_controller/reference_unstamped

nodes:
  obstacle_detector:
    cloud_in: /lidar              # filter_invalid_points が無効点と自車体の点を除いたもの
    obstacle_min_height: 0.15
    obstacle_max_height: 0.5
    obstacle_range_min: 0.0       # Gazebo の LiDAR は 0.15 m 未満を返さない

  navigation:
    publish_base_tf: true         # aft_mapped -> base_link の静的 TF (LiDAR の取付から計算) を出す

  nav2:
    controller_server:
      ros__parameters:
        progress_checker:
          required_movement_radius: 0.5
        general_goal_checker: # ゴール判定
          xy_goal_tolerance: 0.25  # 距離
        FollowPath:
          desired_linear_vel: 0.5
          lookahead_dist: 1.2                       # 既定 0.6。最小旋回半径に近い距離を見る
          min_lookahead_dist: 0.8
          max_lookahead_dist: 2.0
          regulated_linear_scaling_min_radius: 3.0  # 既定 0.9。これより急なカーブでは減速する
    local_costmap:
      local_costmap:
        ros__parameters:
          width: 5
          height: 5
          resolution: 0.1
          inflation_layer:
            cost_scaling_factor: 3.0
            inflation_radius: 0.8
    global_costmap:
      global_costmap:
        ros__parameters:
          resolution: 0.1
          track_unknown_space: false    # 未知の領域を「空き」として扱う（探索しながらの走行向け）
          footprint_padding: 0.15   # 既定 0.01。経路計画時だけ車体を一回り大きく見て、追従誤差・内輪差の分だけ障害物から離す
          width: 100                # ← 追加（農園サイズに合わせて）
          height: 100               # ← 追加
          inflation_layer:
            cost_scaling_factor: 0.5  # 3.0->1.5: コストをゆっくり下げ、障害物から離れた経路ほど得になるようにする
            inflation_radius: 0.5     # 0.8->1.5: 幹から約 1.5 m までコストを付け、大回りの経路を選ばせる
    planner_server:
      ros__parameters:
        GridBased:
          minimum_turning_radius: 2.0         # wheelbase 1.0 / tan(steering_limit 0.5) ~= 1.8
