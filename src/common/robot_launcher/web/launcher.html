<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2027">
<title>ロボットのモード選択</title>
<style>
:root {
  --bg: #eef0f3; --panel: #ffffff; --fg: #1b2027; --muted: #5d6773; --line: #d3d8de;
  --accent: #1769c2; --accent-fg: #ffffff; --ok: #2b8a3e; --bad: #c62828; --track: #dde3ea;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #101317; --panel: #1b2027; --fg: #e8ebef; --muted: #9aa4b1; --line: #343c46;
    --accent: #3d8bfd; --ok: #46c26a; --bad: #e5484d; --track: #2a313a; color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.5 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
main { max-width: 520px; margin: 0 auto; display: grid; gap: 16px;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px))
           calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
h1 { font-size: 1.3rem; margin: 0; }
.sub { color: var(--muted); font-size: 0.9rem; margin: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.modes { display: grid; gap: 10px; }
.mode { width: 100%; text-align: left; display: grid; gap: 2px; padding: 16px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--panel); color: var(--fg); font: inherit; cursor: pointer; }
.mode b { font-size: 1.1rem; }
.mode span { color: var(--muted); font-size: 0.9rem; }
.mode:disabled { opacity: 0.45; cursor: default; }
.mode:not(:disabled):active { border-color: var(--accent); }
.progress { display: grid; justify-items: center; gap: 12px; text-align: center; }
.ring { width: 140px; height: 140px; }
.ring circle { fill: none; stroke-width: 10; }
.ring .track { stroke: var(--track); }
.ring .bar { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 0.4s; }
.ring .spin { transform-origin: 70px 70px; animation: spin 1.2s linear infinite; stroke: var(--accent); opacity: 0.35; }
.ring text { fill: var(--fg); font-size: 22px; font-weight: 700; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .ring .spin { animation: none; } }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; text-align: left; width: 100%; }
.steps li { display: flex; gap: 8px; align-items: center; color: var(--muted); }
.steps li.done { color: var(--ok); }
.steps li.active { color: var(--fg); font-weight: 600; }
.steps li.failed { color: var(--bad); font-weight: 600; }
.steps .mark { width: 1.2em; text-align: center; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
button.act { flex: 1; min-width: 120px; height: 48px; border-radius: 10px; font: inherit; font-weight: 600;
  border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button.danger { background: var(--bad); color: #fff; border-color: var(--bad); }
.err { color: var(--bad); font-weight: 600; }
pre { margin: 0; max-height: 240px; overflow: auto; font-size: 11px; line-height: 1.35;
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; white-space: pre-wrap; word-break: break-all; }
#failed { display: grid; gap: 10px; }
.info { color: var(--muted); font-size: 0.85rem; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <div>
    <h1>ロボットのモード選択</h1>
    <p class="sub" id="conn">接続中…</p>
  </div>

  <section id="running" class="card" hidden>
    <p style="margin:0 0 12px"><b id="rtitle"></b> が動いています</p>
    <div class="row">
      <button class="act primary" id="open">画面を開く</button>
      <button class="act danger" id="stop">停止</button>
    </div>
    <p class="sub" style="margin-top:12px">別のモードに切り替えるときは, 下から選ぶ (今のモードは止まる)</p>
  </section>
  <section id="select" class="modes" hidden></section>

  <section id="progress" class="card progress" hidden>
    <svg class="ring" viewBox="0 0 140 140" aria-hidden="true">
      <circle class="track" cx="70" cy="70" r="58"></circle>
      <circle class="spin" cx="70" cy="70" r="58" stroke-dasharray="60 305"></circle>
      <circle class="bar" id="bar" cx="70" cy="70" r="58" transform="rotate(-90 70 70)"
              stroke-dasharray="364.4" stroke-dashoffset="364.4"></circle>
      <text id="pct" x="70" y="78" text-anchor="middle">0%</text>
    </svg>
    <div><b id="ptitle"></b><div class="sub" id="pmsg"></div></div>
    <ul class="steps" id="steps"></ul>
    <div class="row" style="width:100%"><button class="act" id="cancel">中止</button></div>
  </section>


  <section id="failed" class="card" hidden>
    <div class="err" id="ftitle"></div>
    <div id="fmsg"></div>
    <div class="info" id="flog"></div>
    <pre id="ftail"></pre>
    <div class="row">
      <button class="act primary" id="retry">もう一度</button>
      <button class="act" id="back">モード選択に戻る</button>
    </div>
  </section>

  <p class="info" id="extra"></p>
</main>
<script>
(() => {
  'use strict';
  const key = new URLSearchParams(location.search).get('key') || '';
  const api = (p) => key ? p + (p.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(key) : p;
  const $ = (id) => document.getElementById(id);
  let st = null;
  let waiting = null;   // この画面から起動したモード. 準備ができたらその画面へ移る
  let lastMode = null;
  const CIRC = 2 * Math.PI * 58;

  const modeUrl = () => `${location.protocol}//${location.hostname}:${st.mode_port}/` +
    (key ? '?key=' + encodeURIComponent(key) : '');

  async function post(path, body) {
    try {
      const r = await fetch(api(path), { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body || {}) });
      return await r.json();
    } catch (e) { return { ok: false, message: '接続できません' }; }
  }

  async function start(mode) {
    waiting = mode; lastMode = mode;
    const r = await post('/api/start', { mode });
    if (!r.ok) { waiting = null; alertMsg(r.message); }
    poll();
  }
  function alertMsg(m) { $('conn').textContent = m; }

  function renderModes() {
    const box = $('select');
    box.innerHTML = '';
    for (const m of st.modes) {
      const b = document.createElement('button');
      b.className = 'mode'; b.disabled = !m.available;
      b.innerHTML = '<b></b><span></span>';
      b.querySelector('b').textContent = m.name;
      let note = m.note;
      if (m.id === 'goal' && st.calibration) note += ` (計測結果: ${st.calibration})`;
      b.querySelector('span').textContent = note;
      b.addEventListener('click', () => start(m.id));
      box.appendChild(b);
    }
  }

  function render() {
    const ph = st.phase;
    const busy = ph === 'starting' || ph === 'stopping';
    $('progress').hidden = !busy;
    $('running').hidden = ph !== 'running';
    $('failed').hidden = ph !== 'failed';
    $('select').hidden = busy || ph === 'failed';
    renderModes();

    if (busy) {
      const steps = st.steps || [];
      const done = steps.filter((s) => s.status === 'done').length;
      const frac = steps.length ? done / steps.length : 0;
      $('bar').style.strokeDashoffset = String(CIRC * (1 - frac));
      $('pct').textContent = Math.round(frac * 100) + '%';
      $('ptitle').textContent = ph === 'stopping' ? '停止しています' : `${st.mode_name} を起動しています`;
      const active = steps.find((s) => s.status === 'active');
      $('pmsg').textContent = ph === 'stopping' ? 'プロセスの終了を待っています'
        : active ? `${active.name} を待っています` : '';
      const ul = $('steps'); ul.innerHTML = '';
      for (const s of steps) {
        const li = document.createElement('li'); li.className = s.status;
        li.innerHTML = '<span class="mark"></span><span></span>';
        li.firstChild.textContent = s.status === 'done' ? '✓' : s.status === 'active' ? '…' : '・';
        li.lastChild.textContent = s.name;
        ul.appendChild(li);
      }
      $('cancel').hidden = ph === 'stopping';
    }
    if (ph === 'running') {
      $('rtitle').textContent = st.mode_name;
      if (waiting && waiting === st.mode) { location.href = modeUrl(); return; }
    }
    if (ph === 'failed') {
      waiting = null;
      $('ftitle').textContent = `${st.mode_name || 'モード'} を起動できませんでした`;
      $('fmsg').textContent = st.message;
      $('flog').textContent = st.log_file ? `ログ: ${st.log_file}` : '';
      $('ftail').textContent = (st.log_tail || []).join('\n');
    }
    $('extra').textContent = st.last_map ? `最後に保存した地図: ${st.last_map}` : '';
  }

  async function poll() {
    try {
      const r = await fetch(api('/api/state'), { cache: 'no-store' });
      if (r.status === 403) { $('conn').textContent = 'URL の key が違います'; return; }
      st = await r.json();
      $('conn').textContent = 'モードを選んでください';
      render();
    } catch (e) {
      $('conn').textContent = '接続できません (ロボットのサービスは起動している?)';
    }
  }

  $('cancel').addEventListener('click', async () => { waiting = null; await post('/api/stop'); poll(); });
  $('stop').addEventListener('click', async () => { await post('/api/stop'); poll(); });
  $('open').addEventListener('click', () => { location.href = modeUrl(); });
  $('retry').addEventListener('click', () => { if (lastMode || st.mode) start(lastMode || st.mode); });
  $('back').addEventListener('click', async () => { await post('/api/stop'); poll(); });

  poll();
  setInterval(poll, 700);
})();
</script>
</body>
</html>
