# 実機 (前後 0.50 m x 横幅 0.30 m の車体) 用の Nav2 パラメータ. robot_bringup の robot.launch.py が使う.
# sim (大きい車体) は nav2_params.yaml のまま. 幅 0.80 m のドアを通れるように合わせている:
#   車体 0.30 m + 余白 (footprint_padding) 0.03 m x 2 = 0.36 m. ドアの両側に 0.22 m ずつ残る.
#   costmap の 1 セルは 5 cm (10 cm だとドアの縁が 1 セル分太り, 残りが 0.1 m 近く減る).
#   inflation_radius は外接円 (約 0.33 m) より大きく, ドアの中央 (縁から 0.4 m) を塞がない 0.45 m.
controller_server:
  ros__parameters:
    use_sim_time: true
    use_stamped_vel: false    # 2026/10/04: true->false    # 重要: /cmd_vel を Twist ではなく TwistStamped で出力する設定
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3     # 10 秒でこれだけ動けば進んでいるとみなす
      movement_time_allowance: 10.0

    general_goal_checker: # ゴール判定
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20  # 距離
      yaw_goal_tolerance: 1.0 # 向き[rad] 1rad~=60deg

    # アッカーマン車両用コントローラ設定
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController" # RPP
      desired_linear_vel: 0.3                   # ドアを通るのでゆっくり
      lookahead_dist: 0.6                       # 小さい車体なので近くを見る (最小旋回半径 約 0.75 m)
      min_lookahead_dist: 0.4
      max_lookahead_dist: 1.0
      use_velocity_scaled_lookahead_dist: false
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9  # 既定 0.9。これより急なカーブでは減速する
      regulated_linear_scaling_min_speed: 0.15
      use_rotate_to_heading: false
      allow_reversing: true
      use_costmap_heading: false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: true
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      track_unknown_space: false    # 未知の領域を「空き」として扱う（探索しながらの走行向け）
      footprint: "[[0.25, 0.15], [0.25, -0.15], [-0.25, -0.15], [-0.25, 0.15]]"   # 前後 0.50 x 横幅 0.30
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        max_obstacle_height: 100.0       # レイヤー全体の上限（既定 2.0）。map の z で切られないように大きくする
        observation_sources: obstacles ground_clear
        obstacles:                       # 障害物の判定：地面除去済みの点
          topic: /lidar_obstacles
          data_type: "PointCloud2"
          marking: True
          clearing: False
          min_obstacle_height: -100.0    # 高さはセンサー座標系で判定済みなので、ここでは制限しない
          max_obstacle_height: 100.0     # ※観測ごとの既定値は 0.0。必ず指定する
          obstacle_max_range: 20.0
        ground_clear:                    # 空きセルのクリア：地面を含む全点へレイを飛ばす
          topic: /lidar
          data_type: "PointCloud2"
          marking: False
          clearing: True
          min_obstacle_height: -100.0
          max_obstacle_height: 100.0
          raytrace_max_range: 25.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.45    # 外接円 (約 0.33 m) より大きく, ドアの中央 (縁から 0.4 m) を塞がない

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: true
      resolution: 0.05
      track_unknown_space: false    # 未知の領域を「空き」として扱う（探索しながらの走行向け）
      footprint: "[[0.25, 0.15], [0.25, -0.15], [-0.25, -0.15], [-0.25, 0.15]]"   # 前後 0.50 x 横幅 0.30
      footprint_padding: 0.03   # 経路計画時だけ車体を 3 cm 大きく見る. 0.15 だと幅 0.60 m になりドアをほぼ通れない
      rolling_window: true      # ← 追加（車両中心に追従）
      width: 30                 # 0.05 m のセルで 600 x 600. 広げると経路計画が遅くなる
      height: 30
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        max_obstacle_height: 100.0       # レイヤー全体の上限（既定 2.0）。map の z で切られないように大きくする
        observation_sources: obstacles ground_clear
        obstacles:                       # 障害物の判定：地面除去済みの点
          topic: /lidar_obstacles
          data_type: "PointCloud2"
          marking: True
          clearing: False
          min_obstacle_height: -100.0    # 高さはセンサー座標系で判定済みなので、ここでは制限しない
          max_obstacle_height: 100.0     # ※観測ごとの既定値は 0.0。必ず指定する
          obstacle_max_range: 20.0
        ground_clear:                    # 空きセルのクリア：地面を含む全点へレイを飛ばす
          topic: /lidar
          data_type: "PointCloud2"
          marking: False
          clearing: True
          min_obstacle_height: -100.0
          max_obstacle_height: 100.0
          raytrace_max_range: 25.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.45    # 外接円 (約 0.33 m) より大きく, ドアの中央 (縁から 0.4 m) を塞がない

bt_navigator: # BT: 行動ツリー
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /aft_mapped_to_init    # 2026/10/04: /Odometry->/aft_mapped_to_init
    default_nav_to_pose_bt_xml: ""    # navigation.launch.py で behavior_trees/navigate_keep_path.xml に置換（キーが無いと RewrittenYaml は置換しない）

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      motion_model_for_search: "REEDS_SHEPP"    # 前進のみ # 2026/10/05: "DUBIN"->"REEDS_SHEPP": RPPで後進を許可してるので、それに合わせる
      minimum_turning_radius: 0.75        # wheelbase 0.26 / tan(最大舵角 20 deg) ~= 0.71
      allow_unknown: true
      max_planning_time: 15.0       # 既定 5.0
      downsample_costmap: false     # true にしない（Humble + rolling_window では原点がずれる）
      downsampling_factor: 2        # 0.1 m → 0.2 m 相当で探索
      angle_quantization_bins: 72
      reverse_penalty: 10.0           # 後進のペナルティ
      cost_penalty: 3.0               # 既定 2.0。インフレーション内を通るコストを重くし、障害物から離れた経路を選ばせる

behavior_server: #  [behavior_server]: Initial robot pose is not available.への対処
  ros__parameters:
    use_sim_time: true
    global_frame: map # 規定値がodomであり、TFにodomは存在しない
    robot_base_frame: base_link
