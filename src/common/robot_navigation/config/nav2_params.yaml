controller_server:
  ros__parameters:
    use_sim_time: true
    use_stamped_vel: false    # 2026/10/04: true->false    # 重要: /cmd_vel を Twist ではなく TwistStamped で出力する設定
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    # アッカーマン車両用コントローラ設定
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      use_collision_detection: false # 一時的!!!
      desired_linear_vel: 0.5
      max_linear_accel: 1.0
      max_linear_decel: 1.0
      use_rotate_to_heading: false   # 重要: その場旋回コマンドを無効化
      allow_reversing: true          # バック（後進）での切り返しを許可
      use_costmap_heading: false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: true
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      footprint: "[[0.6, 0.3], [0.6, -0.3], [-0.6, -0.3], [-0.6, 0.3]]"
      plugins: ["voxel_layer", "inflation_layer"]
      
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        observation_sources: pointcloud
        pointcloud:
          topic: /cloud_registered   # Point-LIOが出力する登録点群
          max_obstacle_height: 2.0
          min_obstacle_height: 0.1   # 地面の誤検知防止
          clearing: True
          marking: True
          data_type: "PointCloud2"

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.8

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: true
      resolution: 0.05
      footprint: "[[0.6, 0.3], [0.6, -0.3], [-0.6, -0.3], [-0.6, 0.3]]"
      rolling_window: true      # ← 追加（車両中心に追従）
      width: 100                # ← 追加（農園サイズに合わせて）
      height: 100               # ← 追加
      track_unknown_space: true
      plugins: ["voxel_layer", "inflation_layer"]
      
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        observation_sources: pointcloud
        pointcloud:
          topic: /lidar # 2026/10/05: /cloud_registered->/lidar: cloud_registeredのframe idはcamera init。車両が動いてもcostmapは追従せずcamera initにとどまる。
          max_obstacle_height: 0.5
          min_obstacle_height: 0.1 # 認知下限[m]、global frame z基準
          clearing: True
          marking: True
          data_type: "PointCloud2"

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.8

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /aft_mapped_to_init    # 2026/10/04: /Odometry->/aft_mapped_to_init

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      motion_model_for_search: "DUBIN"    # 前進のみ
      minimum_turning_radius: 2.0         # wheelbase 1.0 / tan(steering_limit 0.5) ~= 1.8
      angle_quantization_bins: 72
      allow_unknown: true
