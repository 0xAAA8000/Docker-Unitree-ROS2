# 実機の LiDAR 取付とフィルタの設定。値は実機に合わせて測って書き換えること。
# lidar_x..lidar_yaw_deg は real.launch.py の静的 TF (base_link -> lidar_link,
# aft_mapped -> base_link) にも使われる。
lidar_bridge:
  ros__parameters:
    cloud_in: /unilidar/cloud
    imu_in: /unilidar/imu
    cloud_out: /lidar
    obstacles_out: /lidar_obstacles
    imu_out: /imu
    lidar_frame: lidar_link
    imu_frame: imu_link
    # IMU 加速度のローパスのカットオフ [Hz]。0 で無効。LiDAR 回転による振動の除去用
    imu_acc_lpf_hz: 0.0    # 有効にする場合の目安: 20.0
    # 点群がこの時間 [s] 以上届かなければ, その場で回転だけしている (回転はジャイロのとおり,
    # 平行移動はしない) とみなして Point-LIO への点群と IMU の加速度を補完する。
    # IMU が届かないときは静止として補完する。途切れ後に自己位置が飛んで流れ続けるのを防ぐ。0 で無効
    gap_fill_timeout: 0.0  # 有効にする場合の目安: 0.3

    # base_link (Nav2 の footprint の中心 = 車体の中心. 地面から 0.16 m) から見た LiDAR の位置 [m]
    # 車体: 前後 0.50 m, 横幅 0.30 m. LiDAR は中心から前に 0.12 m, 横ずれなし, 上に 0.05 m
    lidar_x: 0.12
    lidar_y: 0.0
    lidar_z: 0.05
    # LiDAR の姿勢 [deg]。前 (下向き) に傾けたら pitch が正。
    # 実測は ros2 run lidar_bridge ground_check で (平らな床に止めて推定値を書き写す)
    lidar_roll_deg: 0.0
    lidar_pitch_deg: 31.4
    lidar_yaw_deg: 0.0

    # 以下は base_link 座標 [m]
    ground_z: -0.16               # base_linkから見た地面の z (車体の中心が地面から 0.16 m)
    obstacle_min_height: 0.10     # 地面からこの高さ以上を障害物とする
    obstacle_max_height: 0.35     # 地面からこの高さ未満を障害物とする (これより上は車体に当たらない)
    # 自車体の点を除く箱. 車体 (前後 ±0.25, 左右 ±0.15) より 3 cm 大きく, 地面 (z=-0.16) は含めない
    self_box_min: [-0.28, -0.18, -0.13]
    self_box_max: [0.28, 0.18, 0.15]
    range_min: 0.30               # LiDAR からこの距離未満の点は捨てる
